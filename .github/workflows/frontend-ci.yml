name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/frontend/autofactoryscope-web/package-lock.json
        
    - name: Install dependencies
      working-directory: src/frontend/autofactoryscope-web
      run: npm ci
      
    - name: Lint
      working-directory: src/frontend/autofactoryscope-web
      run: npm run lint
      
    - name: Type check
      working-directory: src/frontend/autofactoryscope-web
      run: npm run type-check
      
    - name: Run tests with coverage
      working-directory: src/frontend/autofactoryscope-web
      run: npm run test:coverage
      
    - name: Build
      working-directory: src/frontend/autofactoryscope-web
      run: npm run build
      
    - name: Build output verification
      if: success()
      run: |
        ls -la src/frontend/autofactoryscope-web/dist/
